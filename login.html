
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171714">
  <title>Login — Owner Circle</title>

  <style>

.register-link {
  display: block;
  width: fit-content;
  margin: 2px auto 0;
  padding: 8px 0;
  color: #5c3829;
  font-size: 12px;
  font-weight: 600;
  text-align: center;
  text-decoration: none;    
  transition: opacity 0.2s ease;
}

.register-link:hover {
  opacity: 0.7;
  text-decoration: underline;
}


.register-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 14px 18px;
  box-sizing: border-box;
  border: 1px solid #5c3829;
  border-radius: 12px;
  background: transparent;
  color: #5c3829;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  transition: background 0.25s ease, color 0.25s ease,
              transform 0.25s ease;
}

.register-button:hover {
  background: #5c3829;
  color: #fffdf8;
  transform: translateY(-2px);
}

.register-button span {
  font-size: 18px;
  transition: transform 0.25s ease;
}

.register-button:hover span {
  transform: translateX(4px);
}

    :root {
      --dark: #171714;
      --cream: #f4f0e7;
      --white: #fffdf8;
      --brown: #5c3829;
      --muted: #77756e;
      --line: #ded9cf;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      color: var(--dark);
      font-family: Arial, Helvetica, sans-serif;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
    }

    .brand {
      margin-bottom: 28px;
      text-align: center;
    }

    .brand-name {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .brand-tagline {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .login-card {
      padding: 32px 26px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--white);
      box-shadow: 0 12px 35px rgba(23, 23, 20, 0.06);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--brown);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -1px;
    }

    .description {
      margin: 12px 0 26px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .form-group {
      margin-bottom: 19px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: #fff;
      color: var(--dark);
      font: inherit;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--brown);
    }

    input::placeholder {
      color: #aaa69d;
    }

    .login-button {
      width: 100%;
      margin-top: 5px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: var(--dark);
      color: var(--white);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .login-button:hover {
      background: var(--brown);
      transform: translateY(-1px);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      flex: 1;
      height: 1px;
      background: var(--line);
      content: "";
    }

    .register-text {
      margin: 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .register-link {
      display: inline-block;
      margin-top: 5px;
      color: var(--brown);
      font-weight: 700;
      text-decoration: none;
    }

    .register-link:hover {
      text-decoration: underline;
    }

    .back-link {
      display: block;
      margin-top: 22px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      text-decoration: none;
    }

    .back-link:hover {
      color: var(--dark);
    }

    .footer {
      margin-top: 25px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px;
      }

      .login-card {
        padding: 28px 22px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>
  <main class="login-wrapper">

    <header class="brand">
      <p class="brand-name">Owner Circle.</p>
      <p class="brand-tagline">Grow Together</p>
    </header>

    <section class="login-card">
      <p class="eyebrow">Selamat Datang</p>
      <h1>Masuk ke akunmu.</h1>

      <p class="description">
        Ruang bertemu, berbagi pengalaman, dan tumbuh bersama
        para pemilik usaha.
      </p>

      <form id="loginForm">
        <div class="form-group">
          <label for="nama">Nama lengkap</label>
          <input
            type="text"
            id="nama"
            name="nama"
            placeholder="Masukkan nama lengkap"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="whatsapp">Nomor WhatsApp</label>
          <input
            type="tel"
            id="whatsapp"
            name="whatsapp"
            placeholder="Contoh: 081234567890"
            autocomplete="tel"
            inputmode="tel"
            required
          >
        </div>

        <button type="submit" class="login-button">
          Masuk ke Owner Circle →
        </button>
      </form>

<div class="divider">BELUM PUNYA AKUN?</div>

<p class="register-text">
  Bergabung dan tumbuh bersama komunitas kami.
</p>

<a href="daftar.html" class="register-link">
  Buat Akun Owner Circle →
</a>


<script>
const RG_FORMS_URL =
  "https://script.google.com/macros/s/AKfycbxKQcKSymmELgSJuVdKXFZyJ-J65ihUPEKj5WkH4lTbf7e3ZTRLB7MCuVvRsj__8nAs/exec";

const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", function (event) {
  event.preventDefault();

  const nama = document.getElementById("nama").value.trim();
  const whatsapp = document.getElementById("whatsapp").value.trim();
  const button = loginForm.querySelector(".login-button");

  if (!nama || !whatsapp) {
    alert("Isi nama lengkap dan nomor WhatsApp terlebih dahulu.");
    return;
  }

  const callbackName = "ocLogin_" + Date.now();
  const script = document.createElement("script");
  const params = new URLSearchParams({
    action: "checkMember",
    nama: nama,
    whatsapp: whatsapp,
    callback: callbackName
  });

  let selesai = false;

  function bersihkan() {
    selesai = true;
    delete window[callbackName];
    script.remove();
    clearTimeout(timeout);
    button.disabled = false;
    button.textContent = "Masuk ke Owner Circle →";
  }

  button.disabled = true;
  button.textContent = "Memeriksa akun...";

  const timeout = setTimeout(function () {
    if (selesai) return;
    bersihkan();
    alert("Pemeriksaan terlalu lama. Silakan coba lagi.");
  }, 15000);

  window[callbackName] = function (result) {
    if (selesai) return;

    bersihkan();

    if (result.status === "error") {
      alert("Data belum bisa diperiksa. Coba lagi nanti.");
      return;
    }

    if (result.exists === true) {
      window.location.href = "index.html";
    } else {
      alert("Akun belum terdaftar. Silakan buat akun terlebih dahulu.");
      window.location.href = "daftar.html";
    }
  };

  script.onerror = function () {
    if (selesai) return;
    bersihkan();
    alert("Tidak dapat terhubung ke RG Forms. Coba lagi.");
  };

  script.src = RG_FORMS_URL + "?" + params.toString();
  document.body.appendChild(script);
});
</script>
</body>
</html>

    </section>
